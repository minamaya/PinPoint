# Self-hosted runner probe (PP-4k0). Temporary: checks, from inside a job, that
# the Bazzite runner VM serves only Tim's same-repo PRs and cannot reach the LAN,
# the tailnet, or the host. Not a required check; removed before merge.

name: Self-hosted probe

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  probe:
    name: Self-hosted probe
    # The runner VM registers with this run's own label. The supervisor on
    # Bazzite cancels any other job that asks for a self-hosted runner.
    runs-on: >-
      ${{ github.run_attempt == 1
      && vars.BAZZITE_LEASE > (github.event.merge_group.head_commit.timestamp || github.event.pull_request.updated_at || '9')
      && (github.event_name == 'merge_group'
      || (vars.BAZZITE_PRS == 'on'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login == 'timothyfroehlich'))
      && format('pinpoint-run-{0}', github.run_id) || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Expression semantics for a lease timestamp
        env:
          GT: ${{ '2026-11-22T22:30:00Z' > '2026-11-22T22:29:59Z' }}
          LT: ${{ '2026-11-22T22:29:59Z' > '2026-11-22T22:30:00Z' }}
          EMPTY: ${{ '' > '2026-11-22T22:29:59Z' }}
          PR_UPDATED: ${{ github.event.pull_request.updated_at }}
          HEAD_TS: ${{ github.event.pull_request.head.repo.pushed_at }}
        run: |
          echo "gt=$GT lt=$LT empty=$EMPTY"
          echo "pr.updated_at=$PR_UPDATED head.repo.pushed_at=$HEAD_TS now=$(date -u +%FT%TZ)"

      - name: Describe the runner
        run: |
          echo "runner: ${RUNNER_NAME} (${RUNNER_ENVIRONMENT})"
          nproc
          free -g
          df -h /
          docker version --format 'docker {{.Server.Version}}'
          ip -4 -brief addr show scope global

      - name: Public internet works
        run: |
          curl -fsS -o /dev/null -w 'api.github.com %{http_code}\n' https://api.github.com
          docker run --rm hello-world | head -3

      - name: Private networks are blocked
        if: runner.environment == 'self-hosted'
        run: |
          open=0
          for target in 192.168.68.94:22 192.168.68.94:54321 192.168.68.1:80 \
                        100.87.228.116:22 100.100.100.100:53 10.88.0.1:22 172.16.0.1:80; do
            if timeout 3 bash -c "echo > /dev/tcp/${target%:*}/${target#*:}" 2>/dev/null; then
              echo "::error::reached ${target}"
              open=1
            else
              echo "blocked ${target}"
            fi
          done
          exit "$open"
